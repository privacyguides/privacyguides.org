name: 📦 Immediate Releases

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "blog/**"

concurrency:
  group: release-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_blog:
    permissions:
      contents: read
    uses: ./.github/workflows/build-blog.yml
    with:
      continue-on-error: false
      context: production

  deploy:
    needs: [build_blog]
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout deployment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/deploy-garage

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-build-*
          merge-multiple: true

      - run: |
          for file in *.tar.gz; do tar -zxf "$file"; done

      - uses: ./.github/actions/deploy-garage
        with:
          endpoint: https://${{ vars.PROD_GARAGE_HOSTNAME }}
          bucket: ${{ vars.PROD_GARAGE_BUCKET }}
          access_key: ${{ secrets.PROD_GARAGE_KEY_ID }}
          secret_key: ${{ secrets.PROD_GARAGE_SECRET_KEY }}
          source_dir: "site/"
          target_dir: "/"
