name: 📦 PR Preview

on:
  workflow_run:
    workflows: [🛠️ Build PR Preview]
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-26.04

    steps:
      - name: Checkout deployment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ref needs to be set so that the action is not run from untrusted PR code
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/deploy-garage

      - name: Download Website Build Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build-combined
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Metadata Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metadata
          path: metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Metadata
        id: metadata
        run: |
          echo "pr_number=$(cat metadata/NR)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat metadata/SHA)" >> "$GITHUB_OUTPUT"

      - name: Limit length of site alias to 12
        env:
          PREVIEW_ALIAS: ${{ steps.metadata.outputs.pr_number }}
        run: echo "SHORT_ALIAS=${PREVIEW_ALIAS:0:12}" >> "$GITHUB_ENV"

      - name: Deploy Preview to Garage
        uses: ./.github/actions/deploy-garage
        with:
          endpoint: https://${{ vars.PREVIEW_GARAGE_HOSTNAME }}
          bucket: ${{ vars.PREVIEW_GARAGE_BUCKET }}
          access_key: ${{ secrets.PREVIEW_GARAGE_KEY_ID }}
          secret_key: ${{ secrets.PREVIEW_GARAGE_SECRET_KEY }}
          source_dir: "site/"
          target_dir: "/${{ env.SHORT_ALIAS }}/"

      - name: Comment with preview link
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          pr-number: ${{ steps.metadata.outputs.pr_number }}
          message: |
            ### <span aria-hidden="true">✅</span> Your preview is ready!

            |  Name | Link |
            | :---: | ---- |
            | <span aria-hidden="true">🔨</span> Latest commit | ${{ steps.metadata.outputs.sha }} |
            | <span aria-hidden="true">😎</span> Preview | https://pr${{ env.SHORT_ALIAS }}.unreviewed.privacyguides.dev/en/ |
          comment-tag: deployment
