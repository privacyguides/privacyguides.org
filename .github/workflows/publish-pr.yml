name: 📦 PR Preview

on:
  workflow_run:
    workflows: [🛠️ Build PR Preview]
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Download Website Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build-combined
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Metadata Artifact
        uses: actions/download-artifact@v4
        with:
          name: metadata
          path: metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Metadata
        id: metadata
        run: |
          echo "pr_number=$(cat metadata/NR)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat metadata/SHA)" >> "$GITHUB_OUTPUT"

      - name: Limit length of site alias to 12
        env:
          PREVIEW_ALIAS: ${{ steps.metadata.outputs.pr_number }}
        run: echo "SHORT_ALIAS=${PREVIEW_ALIAS:0:12}" >> "$GITHUB_ENV"

      - name: Deploy Preview to Garage
        uses: hkdobrev/minio-deploy-action@c758675f5667336646cbaddbf07ea5edfc7b4854
        with:
          endpoint: https://${{ vars.PREVIEW_GARAGE_HOSTNAME }}
          bucket: ${{ vars.PREVIEW_GARAGE_BUCKET }}
          access_key: ${{ secrets.PREVIEW_GARAGE_KEY_ID }}
          secret_key: ${{ secrets.PREVIEW_GARAGE_SECRET_KEY }}
          source_dir: "site/"
          target_dir: "/${{ env.SHORT_ALIAS }}/"

      - name: Comment with preview link
        uses: thollander/actions-comment-pull-request@v2.5.0
        with:
          pr_number: ${{ steps.metadata.outputs.pr_number }}
          message: |
            ### <span aria-hidden="true">✅</span> Your preview is ready!

            |  Name | Link |
            | :---: | ---- |
            | <span aria-hidden="true">🔨</span> Latest commit | ${{ steps.metadata.outputs.sha }} |
            | <span aria-hidden="true">😎</span> Preview | https://pr${{ env.SHORT_ALIAS }}.unreviewed.privacyguides.dev/en/ |
          comment_tag: deployment
