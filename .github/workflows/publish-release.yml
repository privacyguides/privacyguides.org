name: 📦 Release

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        lang: [en, es, fr, he, it, nl, ru, zh-Hant, zh-TW]
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}
      repo: ${{ github.repository }}
      lang: ${{ matrix.lang }}
      context: production
      continue-on-error: false
      cache: false
    secrets:
      MEMBERS_API_URL: ${{ secrets.MEMBERS_API_URL }}

  build_blog:
    permissions:
      contents: read
    uses: ./.github/workflows/build-blog.yml
    with:
      continue-on-error: false
      context: production

  build_zimfile:
    permissions:
      contents: read
    uses: ./.github/workflows/build-zimfile.yml
    with:
      repo: ${{ github.repository }}
      ref: ${{ github.ref }}

  release:
    name: Create release notes
    needs: [build, build_zimfile]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*.zim"
          merge-multiple: true

      - name: Create release notes
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          generateReleaseNotes: true
          artifacts: "*.zim"
          makeLatest: true

  deploy_garage:
    needs: [build, build_blog]
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout deployment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/deploy-garage

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-build-*
          merge-multiple: true

      - run: |
          for file in *.tar.gz; do tar -zxf "$file"; done

      - uses: ./.github/actions/deploy-garage
        with:
          endpoint: https://${{ vars.PROD_GARAGE_HOSTNAME }}
          bucket: ${{ vars.PROD_GARAGE_BUCKET }}
          access_key: ${{ secrets.PROD_GARAGE_KEY_ID }}
          secret_key: ${{ secrets.PROD_GARAGE_SECRET_KEY }}
          source_dir: "site/"
          target_dir: "/"

  deploy_pages:
    needs: [build, build_blog]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-build-*
          merge-multiple: true

      - name: Assemble website
        run: |
          for file in *.tar.gz; do tar -zxf "$file"; done
          cat > site/index.html <<'HTML'
          <html lang="en">
            <head>
              <title>Redirecting...</title>
              <meta http-equiv="refresh" content="0; URL=./en" />
            </head>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
