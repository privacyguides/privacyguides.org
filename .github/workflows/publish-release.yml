name: 📦 Release

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        lang: [en, es, fr, he, it, nl, ru, zh-Hant, zh-TW]
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}
      repo: ${{ github.repository }}
      lang: ${{ matrix.lang }}
      context: production
      continue-on-error: false
      cache: false
    secrets:
      MEMBERS_API_URL: ${{ secrets.MEMBERS_API_URL }}

  build_blog:
    permissions:
      contents: read
    uses: ./.github/workflows/build-blog.yml
    with:
      continue-on-error: false
      context: production

  build_zimfile:
    permissions:
      contents: read
    uses: ./.github/workflows/build-zimfile.yml
    with:
      repo: ${{ github.repository }}
      ref: ${{ github.ref }}

  release:
    name: Create release notes
    needs: [build, build_zimfile]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*.zim"
          merge-multiple: true

      - name: Create release notes
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          artifacts: "*.zim"
          makeLatest: true

  deploy_garage:
    needs: [build, build_blog]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout deployment action
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/deploy-garage

      - uses: actions/download-artifact@v4
        with:
          pattern: site-build-*
          merge-multiple: true

      - run: |
          for file in *.tar.gz; do tar -zxf "$file"; done

      - uses: ./.github/actions/deploy-garage
        with:
          endpoint: https://${{ vars.PROD_GARAGE_HOSTNAME }}
          bucket: ${{ vars.PROD_GARAGE_BUCKET }}
          access_key: ${{ secrets.PROD_GARAGE_KEY_ID }}
          secret_key: ${{ secrets.PROD_GARAGE_SECRET_KEY }}
          source_dir: "site/"
          target_dir: "/"

  deploy_pages:
    needs: [build, build_blog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: site-build-*
          merge-multiple: true

      - name: Assemble website
        run: |
          for file in *.tar.gz; do tar -zxf "$file"; done
          cat > site/index.html <<'HTML'
          <html lang="en">
            <head>
              <title>Redirecting...</title>
              <meta http-equiv="refresh" content="0; URL=./en" />
            </head>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
