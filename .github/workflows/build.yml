name: 🛠️ Build Website

on:
  workflow_call:
    inputs:
      config:
        type: string
        default: build
      ref:
        required: true
        type: string
      repo:
        required: true
        type: string
      lang:
        type: string
        default: en
      context:
        type: string
        default: deploy-preview
      continue-on-error:
        type: boolean
        default: true
      strict:
        type: boolean
        default: false
      cache:
        type: boolean
        default: true
    secrets:
      MEMBERS_API_URL:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.continue-on-error }}
    permissions:
      contents: read

    steps:
      - name: Download Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Download Translations
        if: inputs.lang != 'en'
        uses: actions/checkout@v4
        with:
          repository: privacyguides/i18n
          path: translations
          persist-credentials: false

      - name: Copy Translation Files
        if: inputs.lang != 'en'
        run: cp -a translations/i18n translations/includes .

      - name: Cache MkDocs assets
        if: inputs.cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: mkdocs-${{ inputs.lang }}-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: mkdocs-${{ inputs.lang }}-${{ hashFiles('requirements.txt') }}-

      - name: Set up Docker build image
        uses: ./.github/actions/setup-build

      - name: Build Website
        uses: ./.github/actions/build-site
        env:
          SITE_LANGUAGE: ${{ inputs.lang }}
          BUILD_CONTEXT: ${{ inputs.context }}
          BUILD_OFFLINE: ${{ inputs.config == 'offline' }}
          PRODUCTION: ${{ inputs.config == 'build' }}
          GITAUTHORS: ${{ inputs.lang == 'en' && inputs.config == 'build' }}
          GITREVISIONDATE: ${{ inputs.lang == 'en' && inputs.config == 'build' }}
          MEMBERS_API_URL: ${{ secrets.MEMBERS_API_URL }}
          BUILD_STRICT: ${{ inputs.strict }}
        with:
          command: |
            python tools/generate-members.py > /tmp/members.md && cp /tmp/members.md includes/members.md || true
            flags=()
            if [[ "$BUILD_STRICT" == true ]]; then flags+=(--strict); fi
            ./run.sh build "${flags[@]}"

      - name: Update Discussions
        if: inputs.lang == 'en'
        run: bash tools/generate-topics.sh --all

      - name: Package Website
        run: |
          tar -czf site-${{ inputs.config }}-${{ inputs.lang }}.tar.gz site

      - name: Upload Site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ inputs.config }}-${{ inputs.lang }}.tar.gz
          path: site-${{ inputs.config }}-${{ inputs.lang }}.tar.gz
          retention-days: 1

      - name: Upload members list
        uses: actions/upload-artifact@v4
        if: inputs.config == 'build' && inputs.lang == 'en'
        with:
          name: members.md
          path: includes/members.md
          retention-days: 1
