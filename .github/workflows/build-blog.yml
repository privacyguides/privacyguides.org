name: 🛠️ Build Blog

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      repo:
        required: true
        type: string
      context:
        type: string
        default: deploy-preview
      continue-on-error:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.continue-on-error }}
    permissions:
      contents: read

    steps:
      - name: Download Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Set up Docker build image
        uses: ./.github/actions/setup-build

      - name: Build Blog
        uses: ./.github/actions/build-site
        env:
          BUILD_CONTEXT: ${{ inputs.context }}
        with:
          command: mkdocs build --config-file mkdocs.blog.yml

      - name: Package Website
        run: |
          tar -czf site-build-blog.tar.gz site

      - name: Upload Site
        uses: actions/upload-artifact@v4
        with:
          name: site-build-blog.tar.gz
          path: site-build-blog.tar.gz
          retention-days: 1
