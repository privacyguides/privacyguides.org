name: 🛠️ Build Blog

on:
  workflow_call:
    inputs:
      context:
        type: string
        default: deploy-preview
      continue-on-error:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.continue-on-error }}
    permissions:
      contents: read

    steps:
      - name: Download Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Set up Docker build image
        uses: ./.github/actions/setup-build

      - name: Build Blog
        uses: ./.github/actions/build-site
        env:
          BUILD_CONTEXT: ${{ inputs.context }}
        with:
          command: mkdocs build --config-file mkdocs.blog.yml

      - name: Package Website
        run: |
          tar -czf site-build-blog.tar.gz site

      - name: Upload Site
        uses: actions/upload-artifact@v4
        with:
          name: site-build-blog.tar.gz
          path: site-build-blog.tar.gz
          retention-days: 1
