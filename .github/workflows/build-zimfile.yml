name: 🥝 Build Zimfile

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      repo:
        required: true
        type: string

permissions:
  contents: read

env:
  VIDEOS_SITE_BASE_URL: https://www.privacyguides.org/videos/
  NEWS_SITE_BASE_URL: https://www.privacyguides.org/news/
  HOMEPAGE_CTA_ABOUT_LINK: about.html
  HOMEPAGE_CTA_DONATE_LINK: about/donate.html
  BUILD_OFFLINE: true
  BUILD_CONTEXT: production
  CARDS: false
  GITREVISIONDATE: false
  GITAUTHORS: false

jobs:
  package_eng:
    name: Package English (${{ matrix.edition }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: all
            root: en
            description: Your central privacy and security resource to protect yourself online.
            navigation: |
              LANGUAGE_SWITCHER=false
              MAIN_SITE_BASE_URL=/en/index.html
              MAIN_SITE_ABOUT_URL=/en/about.html
              MAIN_SITE_RECOMMENDATIONS_URL=/en/tools.html
              MAIN_SITE_KNOWLEDGE_BASE_URL=/en/basics/why-privacy-matters.html
              ARTICLES_SITE_BASE_URL=/articles/index.html
          - edition: kb
            root: en
            description: Knowledge base articles and recommendations from Privacy Guides.
            navigation: |
              LANGUAGE_SWITCHER=false
              ARTICLES_SITE_BASE_URL=https://www.privacyguides.org/posts/tag/articles/
          - edition: articles
            root: articles
            description: Long-form articles from the Privacy Guides team and other contributors.
            navigation: |
              MAIN_SITE_BASE_URL=https://www.privacyguides.org/en/
              MAIN_SITE_ABOUT_URL=https://www.privacyguides.org/en/about/
              MAIN_SITE_RECOMMENDATIONS_URL=https://www.privacyguides.org/en/tools/
              MAIN_SITE_KNOWLEDGE_BASE_URL=https://www.privacyguides.org/en/basics/

    steps:
      - name: Set edition navigation
        env:
          EDITION_NAVIGATION: ${{ matrix.navigation }}
        run: printf '%s\n' "$EDITION_NAVIGATION" >> "$GITHUB_ENV"

      - name: Download Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          persist-credentials: "false"
          fetch-depth: 0
          submodules: true

      - name: Set up Docker build image
        uses: ./.github/actions/setup-build

      - name: Build English
        if: matrix.edition != 'articles'
        uses: ./.github/actions/build-site
        with:
          command: |
            python tools/generate-members.py > /tmp/members.md && cp /tmp/members.md includes/members.md || true
            ./run.sh build

      - name: Update Discussions
        if: matrix.edition != 'articles'
        run: bash tools/generate-topics.sh --all

      - name: Delete Unreferenced English Assets
        if: matrix.edition != 'articles'
        run: |
          bash tools/delete-unreferenced.sh
        env:
          ASSETS_DIR: site/en/assets
          SEARCH_DIR: site/en

      - name: Build Articles
        if: matrix.edition != 'kb'
        uses: ./.github/actions/build-site
        with:
          command: ./run.sh --blog build

      - name: Delete Unreferenced Article Assets
        if: matrix.edition != 'kb'
        run: |
          bash tools/delete-unreferenced.sh
        env:
          ASSETS_DIR: site/articles/assets
          SEARCH_DIR: site/articles

      - name: Remove Duplicate Files
        run: |
          cd site && bash ../tools/symlink-duplicates.sh
          ln -s "${{ matrix.root }}/index.html" index.html
          if [[ "${{ matrix.root }}" == en ]]; then
            ln -s en/about/notices.html license
          fi
          cd ..

      - name: Set zimfile name
        run: |
          echo "ZIMFILE_NAME=privacyguides.org_en_${{ matrix.edition }}_$(date +%Y)-$(date +%m).zim" >> "$GITHUB_ENV"

      - name: Create ZIM File
        uses: kohlerdominik/docker-run-action@1c78cb433a3a55b1940eb8c48a3e73eb752e5082 # v2.2.0
        with:
          image: ghcr.io/openzim/zim-tools:3.6.0
          volumes: ${{ github.workspace }}:/data
          run: |
            zimwriterfs \
              -w index.html \
              -I ${{ matrix.root }}/assets/brand/logos/png/square/pg-yellow.png \
              -l eng \
              -t "Privacy Guides" \
              -d "${{ matrix.description }}" \
              -c "Privacy Guides" \
              -p "Privacy Guides" \
              -e "https://www.privacyguides.org" \
              -n "privacyguides.org_en_${{ matrix.edition }}" \
              /data/site/ /data/${{ env.ZIMFILE_NAME }}

      - name: Upload ZIM File
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ZIMFILE_NAME }}
          name: ${{ env.ZIMFILE_NAME }}
          compression-level: 0

      - name: Run zimcheck
        uses: kohlerdominik/docker-run-action@1c78cb433a3a55b1940eb8c48a3e73eb752e5082 # v2.2.0
        continue-on-error: true
        with:
          image: ghcr.io/openzim/zim-tools:3.6.0
          volumes: ${{ github.workspace }}:/data
          run: |
            zimcheck /data/${{ env.ZIMFILE_NAME }}

  build_mul:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    env:
      MAIN_SITE_BASE_URL: /en/index.html
      MAIN_SITE_ABOUT_URL: /en/about.html
      MAIN_SITE_RECOMMENDATIONS_URL: /en/tools.html
      MAIN_SITE_KNOWLEDGE_BASE_URL: /en/basics/why-privacy-matters.html
      ARTICLES_SITE_BASE_URL: /articles/index.html

    strategy:
      matrix:
        lang: [en, es, fr, he, it, nl, ru, zh-Hant]

    steps:
      - name: Download Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          persist-credentials: "false"
          fetch-depth: 0
          submodules: true

      - name: Download Translations
        if: matrix.lang != 'en'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: privacyguides/i18n
          ref: main
          path: .cache/translations
          persist-credentials: false
          sparse-checkout: |
            i18n
            includes

      - name: Copy Translation Files
        if: matrix.lang != 'en'
        run: |
          cp -a .cache/translations/i18n .cache/translations/includes .
          rm -rf .cache/translations

      - name: Set up Docker build image
        uses: ./.github/actions/setup-build

      - name: Build Website
        uses: ./.github/actions/build-site
        env:
          SITE_LANGUAGE: ${{ matrix.lang }}
        with:
          command: |
            python tools/generate-members.py > /tmp/members.md && cp /tmp/members.md includes/members.md || true
            ./run.sh build

      - name: Update Discussions
        if: matrix.lang == 'en'
        run: bash tools/generate-topics.sh --all

      - name: Delete Unreferenced Assets
        run: |
          bash tools/delete-unreferenced.sh
        env:
          ASSETS_DIR: site/${{ matrix.lang }}/assets
          SEARCH_DIR: site/${{ matrix.lang }}

      - name: Build Articles
        if: matrix.lang == 'en'
        uses: ./.github/actions/build-site
        with:
          command: ./run.sh --blog build

      - name: Delete Unreferenced Assets
        if: matrix.lang == 'en'
        run: |
          bash tools/delete-unreferenced.sh
        env:
          ASSETS_DIR: site/articles/assets
          SEARCH_DIR: site/articles

      - name: Package Website
        run: |
          tar -czf site-zimready-${{ matrix.lang }}.tar.gz site

      - name: Upload Site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-zimready-${{ matrix.lang }}.tar.gz
          path: site-zimready-${{ matrix.lang }}.tar.gz
          retention-days: 1
          compression-level: 0

  package_mul:
    runs-on: ubuntu-latest
    needs: [build_mul]
    permissions:
      contents: read

    steps:
      - name: Download Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          persist-credentials: "false"
          fetch-depth: 0

      - name: Download All Sites
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-zimready-*
          merge-multiple: true

      - name: Extract Sites
        run: |
          for file in *.tar.gz; do tar -zxf "$file"; done

      - name: Remove Duplicate Files
        run: |
          cd site && bash ../tools/symlink-duplicates.sh
          ln -s en/index.html index.html
          ln -s en/about/notices.html license
          cd ..

      - name: Set zimfile name
        run: |
          echo "ZIMFILE_NAME=privacyguides.org_mul_all_$(date +%Y)-$(date +%m).zim" >> "$GITHUB_ENV"

      - name: List Files (for debugging)
        run: |
          ls -la site/

      - name: Create ZIM File
        uses: kohlerdominik/docker-run-action@1c78cb433a3a55b1940eb8c48a3e73eb752e5082 # v2.2.0
        with:
          image: ghcr.io/openzim/zim-tools:3.6.0
          volumes: ${{ github.workspace }}:/data
          run: |
            zimwriterfs \
              -w index.html \
              -I en/assets/brand/logos/png/square/pg-yellow.png \
              -l mul \
              -t "Privacy Guides" \
              -d "Your central privacy and security resource to protect yourself online." \
              -c "Privacy Guides" \
              -p "Privacy Guides" \
              -e "https://www.privacyguides.org" \
              -n "privacyguides.org_mul_all" \
              /data/site/ /data/${{ env.ZIMFILE_NAME }}

      - name: Upload ZIM File
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ZIMFILE_NAME }}
          name: ${{ env.ZIMFILE_NAME }}
          compression-level: 0

      - name: Run zimcheck
        uses: kohlerdominik/docker-run-action@1c78cb433a3a55b1940eb8c48a3e73eb752e5082 # v2.2.0
        continue-on-error: true
        with:
          image: ghcr.io/openzim/zim-tools:3.6.0
          volumes: ${{ github.workspace }}:/data
          run: |
            zimcheck /data/${{ env.ZIMFILE_NAME }}
